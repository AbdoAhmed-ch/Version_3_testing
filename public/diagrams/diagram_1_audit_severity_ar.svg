
  <svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="shadow1ar" x="-5%" y="-5%" width="110%" height="115%">
        <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04"/>
      </filter>
    </defs>
    
    <!-- White Background -->
    <rect width="1200" height="280" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <text x="600" y="45" text-anchor="middle" fill="#0F172A" font-size="16" font-weight="800" font-family="Segoe UI, Tahoma, Cairo, Arial, sans-serif">نتائج الفحص الفني وتصنيف الملاحظات حسب درجة الخطورة</text>
    <text x="600" y="70" text-anchor="middle" fill="#64748B" font-size="13" font-family="Segoe UI, Tahoma, Cairo, Arial, sans-serif">الفحص الفني للجاهزية المؤسسية لمنصة شاميليون — نوفمبر 2026</text>
    
    <!-- 4 Cards RTL layout -->
    <g transform="translate(60, 100)" filter="url(#shadow1ar)">
      <rect width="240" height="135" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
      <text x="120" y="45" text-anchor="middle" fill="#059669" font-size="16" font-weight="800" font-family="Segoe UI, Tahoma, Cairo, Arial, sans-serif">منخفضة (Low)</text>
      <text x="120" y="95" text-anchor="middle" fill="#065F46" font-size="34" font-weight="900" font-family="Segoe UI, Tahoma, Cairo, Arial, sans-serif">2</text>
      <text x="120" y="120" text-anchor="middle" fill="#64748B" font-size="12" font-weight="600" font-family="Segoe UI, Tahoma, Cairo, Arial, sans-serif">تحسينات تشغيلية خفيفة</text>
    </g>
    <g transform="translate(330, 100)" filter="url(#shadow1ar)">
      <rect width="240" height="135" rx="12" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5"/>
      <text x="120" y="45" text-anchor="middle" fill="#0284C7" font-size="16" font-weight="800" font-family="Segoe UI, Tahoma, Cairo, Arial, sans-serif">متوسطة (Medium)</text>
      <text x="120" y="95" text-anchor="middle" fill="#075985" font-size="34" font-weight="900" font-family="Segoe UI, Tahoma, Cairo, Arial, sans-serif">3</text>
      <text x="120" y="120" text-anchor="middle" fill="#64748B" font-size="12" font-weight="600" font-family="Segoe UI, Tahoma, Cairo, Arial, sans-serif">حوكمة جودة ونقل بيانات</text>
    </g>
    <g transform="translate(600, 100)" filter="url(#shadow1ar)">
      <rect width="240" height="135" rx="12" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
      <text x="120" y="45" text-anchor="middle" fill="#D97706" font-size="16" font-weight="800" font-family="Segoe UI, Tahoma, Cairo, Arial, sans-serif">مرتفعة (High)</text>
      <text x="120" y="95" text-anchor="middle" fill="#92400E" font-size="34" font-weight="900" font-family="Segoe UI, Tahoma, Cairo, Arial, sans-serif">3</text>
      <text x="120" y="120" text-anchor="middle" fill="#64748B" font-size="12" font-weight="600" font-family="Segoe UI, Tahoma, Cairo, Arial, sans-serif">معالجات أمنية ومعمارية</text>
    </g>
    <g transform="translate(870, 100)" filter="url(#shadow1ar)">
      <rect width="240" height="135" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
      <text x="120" y="45" text-anchor="middle" fill="#DC2626" font-size="16" font-weight="800" font-family="Segoe UI, Tahoma, Cairo, Arial, sans-serif">حرجة (Critical)</text>
      <text x="120" y="95" text-anchor="middle" fill="#991B1B" font-size="34" font-weight="900" font-family="Segoe UI, Tahoma, Cairo, Arial, sans-serif">0</text>
      <text x="120" y="120" text-anchor="middle" fill="#64748B" font-size="12" font-weight="600" font-family="Segoe UI, Tahoma, Cairo, Arial, sans-serif">خلو تام من الثغرات الحرجة</text>
    </g>
  </svg>