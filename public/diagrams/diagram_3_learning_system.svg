
  <svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="shadow3" x="-5%" y="-5%" width="110%" height="115%">
        <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.04"/>
      </filter>
    </defs>
    
    <!-- White Background -->
    <rect width="1200" height="420" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Title -->
    <text x="600" y="48" text-anchor="middle" fill="#0F172A" font-size="20" font-weight="800" letter-spacing="2" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
      CHAMELEON LEARNING SYSTEM
    </text>
    <text x="600" y="72" text-anchor="middle" fill="#64748B" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
      Core Functional Pillars Engineered for Alexandria University FCDS
    </text>
    
    <!-- Pillar 1: Formative Assessment -->
    <g transform="translate(60, 105)" filter="url(#shadow3)">
      <rect width="330" height="175" rx="12" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5"/>
      <circle cx="45" cy="45" r="20" fill="#0284C7" fill-opacity="0.12"/>
      <path d="M37 45 L43 51 L53 39" stroke="#0284C7" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="78" y="42" fill="#0F172A" font-size="16" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">Formative Assessment</text>
      <text x="78" y="60" fill="#0284C7" font-size="13" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">&amp; Interactive Practice</text>
      
      <line x1="25" y1="85" x2="305" y2="85" stroke="#E2E8F0" stroke-width="1"/>
      <text x="35" y="112" fill="#0284C7" font-size="14" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">• 211 Active Live Quizzes</text>
      <text x="35" y="134" fill="#334155" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">• Instant Feedback &amp; Exam Modes</text>
      <text x="35" y="156" fill="#334155" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">• KaTeX LaTeX Math &amp; Rich Tables</text>
    </g>

    <!-- Pillar 2: Marline AI Advisor -->
    <g transform="translate(435, 105)" filter="url(#shadow3)">
      <rect width="330" height="175" rx="12" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
      <circle cx="45" cy="45" r="20" fill="#4F46E5" fill-opacity="0.12"/>
      <circle cx="45" cy="45" r="9" stroke="#4F46E5" stroke-width="2.2" fill="none"/>
      <path d="M45 31 L45 34 M45 56 L45 59 M31 45 L34 45 M56 45 L59 45" stroke="#4F46E5" stroke-width="2.2"/>
      <text x="78" y="42" fill="#0F172A" font-size="16" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">Marline AI Advisor</text>
      <text x="78" y="60" fill="#4F46E5" font-size="13" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">Context-Aware Bylaws</text>
      
      <line x1="25" y1="85" x2="305" y2="85" stroke="#E2E8F0" stroke-width="1"/>
