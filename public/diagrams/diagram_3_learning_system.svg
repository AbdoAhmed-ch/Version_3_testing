      <text x="35" y="134" fill="#334155" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">• FCDS Bylaw &amp; Prereq Grounding</text>
      <text x="35" y="156" fill="#334155" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">• Daily 20-Question Budget Quota</text>
    </g>

    <!-- Pillar 3: Mathematics Engines -->
    <g transform="translate(810, 105)" filter="url(#shadow3)">
      <rect width="330" height="175" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
      <circle cx="45" cy="45" r="20" fill="#059669" fill-opacity="0.12"/>
      <path d="M37 38 L42 52 L48 42 L53 50" stroke="#059669" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="78" y="42" fill="#0F172A" font-size="16" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">Scientific Math Engines</text>
      <text x="78" y="60" fill="#059669" font-size="13" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">Client-Side Linear Algebra</text>
      
      <line x1="25" y1="85" x2="305" y2="85" stroke="#E2E8F0" stroke-width="1"/>
      <text x="35" y="112" fill="#059669" font-size="14" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">• LU &amp; QR Decomposition with Steps</text>
      <text x="35" y="134" fill="#334155" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">• Determinants, Inverses, Eigenvalues</text>
      <text x="35" y="156" fill="#334155" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">• Real-Time Function Graphing Canvas</text>
    </g>

    <!-- Bottom Curricular Anchor -->
    <g transform="translate(60, 310)" filter="url(#shadow3)">
      <rect width="1080" height="70" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
      <text x="540" y="42" text-anchor="middle" fill="#0F172A" font-size="15" font-weight="800" letter-spacing="1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
        Curricular Structure: 6 Academic Departments  |  4 Academic Levels  |  Alexandria University FCDS
      </text>
      <text x="540" y="60" text-anchor="middle" fill="#64748B" font-size="12" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
        AI • CS (General) • Cyber Security • Business Analytics • Health Informatics • Media Analytics
