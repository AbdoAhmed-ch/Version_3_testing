      <polygon points="116,4 120,-4 124,4" fill="#0284C7"/>
      
      <path d="M680 20 L680 0" stroke="#0284C7" stroke-width="2"/>
      <polygon points="676,4 680,-4 684,4" fill="#0284C7"/>
      
      <path d="M120 20 L680 20" stroke="#0284C7" stroke-width="2"/>
      
