
  <svg width="1200" height="480" viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="shadow5" x="-5%" y="-5%" width="110%" height="115%">
        <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.04"/>
      </filter>
    </defs>
    
    <!-- White Background -->
    <rect width="1200" height="480" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Title -->
