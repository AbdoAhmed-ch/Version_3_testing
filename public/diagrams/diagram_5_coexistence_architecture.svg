      <text x="250" y="42" text-anchor="middle" fill="#0F172A" font-size="16" font-weight="800" letter-spacing="1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
