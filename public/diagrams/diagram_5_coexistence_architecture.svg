      </text>
      <text x="250" y="65" text-anchor="middle" fill="#64748B" font-size="13" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
        (Administrative &amp; Formal Infrastructure)
      </text>
      <line x1="40" y1="85" x2="460" y2="85" stroke="#E2E8F0" stroke-width="1"/>
      
      <text x="45" y="120" fill="#334155" font-size="14" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">• Official Student Records &amp; Course Registration</text>
      <text x="45" y="152" fill="#334155" font-size="14" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">• Official Gradebook &amp; Final GPA Tracking</text>
      <text x="45" y="184" fill="#334155" font-size="14" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">• Primary Lecture Syllabus &amp; Material Distribution</text>
      <text x="45" y="216" fill="#334155" font-size="14" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">• Formal Midterm &amp; Final Summative Examinations</text>
      <text x="45" y="248" fill="#334155" font-size="14" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">• Mandatory Administrative Compliance</text>
    </g>

    <!-- COLUMN 2: CHAMELEON LEARNING SYSTEM -->
    <g transform="translate(630, 75)" filter="url(#shadow5)">
      <rect width="500" height="280" rx="14" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5"/>
      <text x="250" y="42" text-anchor="middle" fill="#0284C7" font-size="16" font-weight="800" letter-spacing="1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
