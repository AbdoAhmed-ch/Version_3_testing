      COMPLEMENTARY COEXISTENCE ARCHITECTURE
    </text>

    <!-- COLUMN 1: OFFICIAL UNIVERSITY SYSTEMS -->
    <g transform="translate(70, 75)" filter="url(#shadow5)">
