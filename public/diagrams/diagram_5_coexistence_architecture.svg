      <text x="400" y="25" text-anchor="middle" fill="#0284C7" font-size="12" font-weight="800" letter-spacing="1.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
