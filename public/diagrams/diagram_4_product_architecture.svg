      <text x="40" y="153" fill="#0F172A" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">• Row-Level Security (RLS) &amp; B-Tree Performance Indexes</text>
      <text x="40" y="175" fill="#0F172A" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">• Atomic PL/pgSQL RPC Procedures <tspan fill="#64748B" font-weight="500">(Coins &amp; AI Credits)</tspan></text>
    </g>

