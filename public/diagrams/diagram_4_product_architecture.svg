      <text x="40" y="103" fill="#0F172A" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">• Layer 2: <tspan fill="#B45309">Groq Inference</tspan> <tspan fill="#64748B" font-weight="500">(qwen3.8-27b / gpt-oss)</tspan></text>
      <text x="40" y="128" fill="#0F172A" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">• Layer 3: <tspan fill="#B45309">Google Gemini</tspan> <tspan fill="#64748B" font-weight="500">(gemini-2.5-flash High Context)</tspan></text>
      <text x="40" y="153" fill="#0F172A" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">• Layer 4: <tspan fill="#B45309">OpenRouter</tspan> <tspan fill="#64748B" font-weight="500">(nemotron-3.5 Backup Tier)</tspan></text>
      <text x="40" y="175" fill="#0F172A" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">• Layer 5: <tspan fill="#B45309">Cloudflare Workers AI</tspan> <tspan fill="#64748B" font-weight="500">(@cf/qwen3.8-27b Edge)</tspan></text>
