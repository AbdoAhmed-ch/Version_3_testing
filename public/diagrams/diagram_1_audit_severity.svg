
  <svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="shadow1" x="-5%" y="-5%" width="110%" height="115%">
        <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04"/>
      </filter>
    </defs>
    
    <!-- White Background -->
    <rect width="1200" height="280" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Title -->
    <text x="600" y="45" text-anchor="middle" fill="#0F172A" font-size="15" font-weight="800" letter-spacing="2.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
      AUDIT FINDINGS BY SEVERITY
    </text>
    <text x="600" y="70" text-anchor="middle" fill="#64748B" font-size="12" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
      Internal Product, Technical and Institutional Readiness Assessment
    </text>
    
    <!-- Metric Cards -->
    <!-- Card 1: Critical -->
    <g transform="translate(60, 100)" filter="url(#shadow1)">
      <rect width="240" height="135" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
      <circle cx="45" cy="45" r="18" fill="#EF4444" fill-opacity="0.12"/>
      <path d="M45 35 L45 47 M45 52 L45 55" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
      <text x="75" y="52" fill="#DC2626" font-size="16" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">CRITICAL</text>
      <text x="120" y="105" text-anchor="middle" fill="#991B1B" font-size="34" font-weight="900" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">0</text>
      <text x="120" y="122" text-anchor="middle" fill="#64748B" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">Zero High-Risk Exploits</text>
    </g>

    <!-- Card 2: High -->
    <g transform="translate(330, 100)" filter="url(#shadow1)">
      <rect width="240" height="135" rx="12" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
      <circle cx="45" cy="45" r="18" fill="#F59E0B" fill-opacity="0.12"/>
      <path d="M45 36 L52 50 L38 50 Z" stroke="#D97706" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
      <text x="75" y="52" fill="#D97706" font-size="16" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">HIGH</text>
      <text x="120" y="105" text-anchor="middle" fill="#92400E" font-size="34" font-weight="900" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">3</text>
      <text x="120" y="122" text-anchor="middle" fill="#64748B" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">Architectural Remediations</text>
    </g>

    <!-- Card 3: Medium -->
    <g transform="translate(600, 100)" filter="url(#shadow1)">
      <rect width="240" height="135" rx="12" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5"/>
      <circle cx="45" cy="45" r="18" fill="#0284C7" fill-opacity="0.12"/>
      <circle cx="45" cy="45" r="7" stroke="#0284C7" stroke-width="2.5" fill="none"/>
      <text x="75" y="52" fill="#0284C7" font-size="16" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">MEDIUM</text>
      <text x="120" y="105" text-anchor="middle" fill="#075985" font-size="34" font-weight="900" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">3</text>
      <text x="120" y="122" text-anchor="middle" fill="#64748B" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">Operational Optimizations</text>
    </g>

    <!-- Card 4: Low -->
    <g transform="translate(870, 100)" filter="url(#shadow1)">
      <rect width="240" height="135" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
      <circle cx="45" cy="45" r="18" fill="#059669" fill-opacity="0.12"/>
      <path d="M38 45 L43 50 L52 40" stroke="#059669" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="75" y="52" fill="#059669" font-size="16" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">LOW</text>
      <text x="120" y="105" text-anchor="middle" fill="#065F46" font-size="34" font-weight="900" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">2</text>
      <text x="120" y="122" text-anchor="middle" fill="#64748B" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">Maintenance Polish</text>
    </g>
  </svg>