
  <svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="shadow3ar" x="-5%" y="-5%" width="110%" height="115%">
        <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.04"/>
      </filter>
    </defs>
    
    <!-- White Background -->
    <rect width="1200" height="420" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Title -->
    <text x="600" y="48" text-anchor="middle" fill="#0F172A" font-size="20" font-weight="800" font-family="Segoe UI, Tahoma, Cairo, Arial, sans-serif">
      منظومة التعلم الذكية في شاميليون (CHAMELEON LEARNING SYSTEM)
    </text>
    <text x="600" y="74" text-anchor="middle" fill="#64748B" font-size="13" font-family="Segoe UI, Tahoma, Cairo, Arial, sans-serif">
